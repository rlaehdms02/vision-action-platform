{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vision AI{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Vision AI <span>동작 분석</span></a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'analysis_home' %}">분석</a>
        {% if user.is_staff %}<a href="{% url 'dashboard' %}">대시보드</a><a href="/admin/">관리자</a>{% endif %}
        <span class="who">{{ user.username }}님</span>
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}<button type="submit" class="link">로그아웃</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">로그인</a>
        <a href="{% url 'signup' %}">회원가입</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
